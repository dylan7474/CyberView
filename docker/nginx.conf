worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  # Compress text and JSON: the findings download is ~65 MB of JSON for 180,000 findings and shrinks about 10x.
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json text/css application/javascript text/plain;
  access_log off;
  server_tokens off;
  client_max_body_size 300m;          # large vulnerability imports and restores
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  server {                             # plain HTTP only redirects
    listen 80 default_server;
    server_name _;
    return 301 https://$host__PORT__$request_uri;
  }
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /certs/portal.crt;
    ssl_certificate_key /certs/portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # no HSTS: with a self-signed certificate it would stop browsers offering "continue anyway"
    location / {
      proxy_pass http://app:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
