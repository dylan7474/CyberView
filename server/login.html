<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · CyberView</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(120deg,#4338ca,#4338ca 35%,#0f172a); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color:#1f2937; }
  form { background:#fff; width:100%; max-width:340px; margin:16px; padding:28px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { margin:0 0 4px; font-size:20px; color:#0f172a; font-weight:700; letter-spacing:-.01em; }
  p.sub { margin:0 0 20px; font-size:12px; color:#64748b; }
  label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; }
  input:focus { outline:2px solid #a5b4fc; border-color:#6366f1; }
  button { width:100%; margin-top:20px; padding:10px; background:#4f46e5; color:#fff; border:0; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #err { margin-top:14px; font-size:13px; color:#b91c1c; min-height:1em; }
</style>
</head>
<body>
<form id="f">
  <h1>CyberView</h1>
  <p class="sub">Platform Infrastructure · sign in</p>
  <label for="u">User name</label>
  <input id="u" autocomplete="username" autofocus required>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    // v4.39: the API is at the site root, also when this form is shown at /new/
    const r = await fetch(location.pathname.replace(/[^/]*$/, '').replace(/\/new\/$/, '/') + 'api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'portal' },
      body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value }) });
    if (r.ok) { location.reload(); return; }
    let j = {}; try { j = await r.json(); } catch (x) {}
    err.textContent = j.error || ('Sign-in failed (' + r.status + ')');
  } catch (x) { err.textContent = 'Could not reach the server.'; }
  b.disabled = false;
});
</script>
</body>
</html>
